name: NexTunnel release (unsigned)

# Builds and publishes unsigned binaries for the NexTunnel native app.
# Trigger:
#   - push a tag like nextunnel-v1.0.0 → uploads to a GitHub Release
#   - manual workflow_dispatch → builds artifacts only (for testing)
#
# Why unsigned: per Pablo's "no plata adicional" constraint, we don't pay
# for Apple Developer ($99/yr) or Microsoft Authenticode certs ($200-500/yr).
# First-launch warnings are documented on /downloads.

on:
  push:
    tags:
      - 'nextunnel-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-14
    env:
      VERSION_ARG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
      - name: Build
        run: bash scripts/build-unsigned.sh "$VERSION_ARG"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  build-linux-android:
    runs-on: ubuntu-22.04
    env:
      VERSION_ARG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - name: Build
        run: bash scripts/build-unsigned.sh "$VERSION_ARG"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-android
          path: dist/

  build-windows:
    runs-on: windows-2022
    env:
      VERSION_ARG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
      - name: Build
        shell: bash
        run: bash scripts/build-unsigned.sh "$VERSION_ARG"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  release:
    needs: [build-macos, build-linux-android, build-windows]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/nextunnel-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

name: NexTunnel release (unsigned)

# Builds unsigned binaries for the NexTunnel native app.
# Tag nextunnel-v* → publishes a GitHub Release.
# workflow_dispatch → builds artifacts only.
# No Apple/Microsoft certs (Pablo's "no plata adicional"); users see a
# one-time Gatekeeper/SmartScreen warning.

on:
  push:
    tags:
      - 'nextunnel-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-22.04
    env:
      VERSION_ARG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
      - name: Prepare hiddify-core libs (downloads prebuilt .so)
        run: make android-prepare
      - name: Build APK
        run: |
          mkdir -p dist
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk "dist/NexTunnel-${VERSION_ARG}-android.apk"
          cd dist && shasum -a 256 *.apk > checksums-android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/

  build-linux:
    runs-on: ubuntu-22.04
    env:
      VERSION_ARG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libcurl4-openssl-dev libsecret-1-dev libjsoncpp-dev
      - name: Prepare hiddify-core libs (Linux amd64)
        run: make linux-amd64-prepare
      - name: Build Linux bundle
        run: |
          mkdir -p dist
          flutter build linux --release
          pushd build/linux/x64/release/bundle >/dev/null
          tar -czf "../../../../../dist/NexTunnel-${VERSION_ARG}-linux-x64.tar.gz" .
          popd >/dev/null
          cd dist && shasum -a 256 *.tar.gz > checksums-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/

  build-windows:
    runs-on: windows-2022
    env:
      VERSION_ARG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
      - name: Prepare hiddify-core libs (Windows)
        shell: bash
        run: make windows-prepare
      - name: Build Windows
        shell: bash
        run: |
          mkdir -p dist
          flutter build windows --release
          pushd build/windows/x64/runner/Release >/dev/null
          7z a -tzip "../../../../../dist/NexTunnel-${VERSION_ARG}-windows-x64.zip" "*"
          popd >/dev/null
          cd dist && sha256sum *.zip > checksums-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  release:
    needs: [build-android, build-linux, build-windows]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/nextunnel-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Consolidate checksums
        run: cd dist && cat checksums-*.txt > checksums.txt && rm checksums-*.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
